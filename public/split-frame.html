<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@woby/three - Split Frame Layout</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .frame-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .menu-frame {
            width: 288px;
            height: 100%;
            border: none;
            border-right: 1px solid #374151;
        }
        .canvas-frame {
            flex: 1;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="frame-container">
        <iframe src="/menu-frame.html" class="menu-frame" title="Menu Panel"></iframe>
        <iframe src="/canvas-frame.html" class="canvas-frame" title="Canvas Area"></iframe>
    </div>
</body>
</html>
